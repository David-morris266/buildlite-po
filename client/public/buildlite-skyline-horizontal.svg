  <g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="143" y="79" font-size="51" font-weight="750" letter-spacing="-2.2" fill="#f4f8f6" stroke="#10201c" stroke-width="1.6" paint-order="stroke">Build<tspan fill="#00d985" stroke="#063c2b">Lite</tspan></text><text x="146" y="105" font-size="15" font-weight="600" letter-spacing="1.35" fill="#9eb5ad" stroke="#10201c" stroke-width=".7" paint-order="stroke">LEAN COMMERCIAL CONTROL</text></g>
</svg>
